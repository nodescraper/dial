name: Plugin release

# Push a tag like plugin-v0.1.0.0 to build the plugin zip and attach it to a GitHub release.
# Then update manifest.json (version, sourceUrl, checksum) so Jellyfin offers the new version.

on:
  push:
    tags: ["plugin-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build -c Release Plugin
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#plugin-v}"
          mkdir -p package
          cp Plugin/bin/Release/net10.0/Dial.Plugin.dll package/
          cat > package/meta.json <<EOF
          {
            "guid": "b5c1f0a2-7d3e-4c58-9a41-2f6e8d0c1b73",
            "name": "Dial",
            "version": "${VERSION}",
            "targetAbi": "12.4.0.0",
            "overview": "Discovery, mixtapes and sound search for the Dial apps, built on your Jellyfin library.",
            "owner": "nodescraper",
            "category": "General"
          }
          EOF
          (cd package && zip -q "../dial_${VERSION}.zip" Dial.Plugin.dll meta.json)
          echo "md5: $(md5sum "dial_${VERSION}.zip" | cut -d' ' -f1)"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="dial_${GITHUB_REF_NAME#plugin-v}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Dial plugin ${GITHUB_REF_NAME#plugin-v}" --generate-notes
          fi
